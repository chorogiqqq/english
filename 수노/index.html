<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Music & Precision Synced Lyric Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(18, 22, 41, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-cyan: #00f2fe;
      --accent-purple: #9d4edd;
      --accent-pink: #f72585;
      --accent-glow: rgba(0, 242, 254, 0.35);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Pretendard', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Canvas Background */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Main Container Card */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1050px;
      height: 740px;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 50px var(--accent-glow);
      display: grid;
      grid-template-columns: 380px 1fr;
      overflow: hidden;
    }

    /* Left Music Vinyl Player Section */
    .left-section {
      background: rgba(10, 14, 29, 0.75);
      border-right: 1px solid var(--card-border);
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .header-tag {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      background: rgba(0, 242, 254, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 242, 254, 0.25);
    }

    /* Animated Vinyl Record */
    .vinyl-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 16px 0;
    }

    .vinyl-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #222 18%, #111 20%, #151515 35%, #050505 70%);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: rotateDisc 25s linear infinite;
      animation-play-state: paused;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .vinyl-disc.playing {
      animation-play-state: running;
    }

    .vinyl-cover {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background-image: url('cover_art.svg');
      background-size: cover;
      background-position: center;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    @keyframes rotateDisc {
      100% { transform: rotate(360deg); }
    }

    /* Sound Frequency Visualizer Canvas */
    #visualizerCanvas {
      width: 100%;
      height: 40px;
      margin-top: 6px;
      border-radius: 12px;
    }

    .song-title-group {
      text-align: center;
      margin-bottom: 8px;
    }

    .song-title-group h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .song-title-group p {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* Player Controls */
    .controls-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .scrubber-group {
      width: 100%;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      border-radius: 10px;
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 6px;
      font-weight: 600;
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--accent-cyan);
    }

    .play-main-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .play-main-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 14px 35px rgba(0, 242, 254, 0.5);
    }

    /* Right Lyrics & Sync Adjustment Panel */
    .right-section {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: rgba(15, 19, 38, 0.4);
    }

    .top-toolbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .toolbar-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .edit-lyrics-btn {
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: var(--accent-cyan);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .edit-lyrics-btn:hover {
      background: var(--accent-cyan);
      color: #000;
    }

    /* Sync Offset Control Bar */
    .sync-control-bar {
      padding: 10px 24px;
      background: rgba(0, 242, 254, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .sync-label {
      font-weight: 700;
      color: var(--accent-cyan);
      white-space: nowrap;
    }

    .offset-btn-group {
      display: flex;
      gap: 6px;
    }

    .offset-btn {
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .offset-btn:hover {
      background: var(--accent-cyan);
      color: #000;
    }

    .offset-value {
      font-weight: 800;
      color: #fff;
      min-width: 50px;
      text-align: center;
    }

    /* Section Navigator Chips */
    .section-chips-bar {
      padding: 10px 24px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .section-chips-bar::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      padding: 5px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .chip-btn:hover, .chip-btn.active {
      background: linear-gradient(90deg, rgba(0, 242, 254, 0.25), rgba(157, 78, 221, 0.25));
      border-color: var(--accent-cyan);
      color: #fff;
    }

    /* Lyrics Display Container */
    .lyrics-scroll-box {
      flex: 1;
      padding: 30px 24px;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .lyrics-scroll-box::-webkit-scrollbar {
      width: 6px;
    }
    .lyrics-scroll-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    .sec-badge {
      align-self: flex-start;
      font-size: 0.73rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 1.5px;
      margin-top: 14px;
      text-transform: uppercase;
      background: rgba(0, 242, 254, 0.08);
      padding: 4px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--accent-cyan);
    }

    .lyric-item {
      font-size: 1.1rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.38);
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1.55;
    }

    .lyric-item:hover {
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.04);
    }

    .lyric-item.active {
      font-size: 1.32rem;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(90deg, rgba(0, 242, 254, 0.22), rgba(157, 78, 221, 0.05));
      border-left: 5px solid var(--accent-cyan);
      padding-left: 18px;
      box-shadow: 0 4px 20px rgba(0, 242, 254, 0.15);
      text-shadow: 0 0 16px rgba(0, 242, 254, 0.6);
    }

    .lyric-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--accent-cyan);
      color: #fff;
      font-size: 1.1rem;
      padding: 6px 12px;
      border-radius: 8px;
      outline: none;
    }

    @media (max-width: 820px) {
      .app-container {
        grid-template-columns: 1fr;
        height: auto;
        max-height: 92vh;
      }
      .left-section {
        padding: 24px;
      }
      .vinyl-wrapper {
        width: 160px;
        height: 160px;
      }
    }
  </style>
</head>
<body>

      </div>

      <div class="lyrics-scroll-box" id="lyricsBox">
        <!-- Exact 53 Lyric Lines Generated Here -->
      </div>
    </div>
  </div>

  <audio id="audio" src="내 손으로 세상을 움직일 거야.mp3"></audio>

  <script>
    // 100% Exact SRT Timestamps & 53 Full Lines Data

      { time: 134.84, text: "포기 말고, 포기 말고" },

      { time: 142.74, text: "사흘의 불꽃으로" },
      { time: 146.01, text: "교육생 여러분" },
      { time: 148.09, text: "우린 더 멀리 가" }
    ];

    // DOM Elements
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const vinylDisc = document.getElementById('vinylDisc');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const speedBtn = document.getElementById('speedBtn');
    const loopBtn = document.getElementById('loopBtn');
    const lyricsBox = document.getElementById('lyricsBox');
    const sectionChips = document.getElementById('sectionChips');
    const offsetValEl = document.getElementById('offsetVal');
    const editLyricsBtn = document.getElementById('editLyricsBtn');

    let lyricEls = [];
    let currentActiveIdx = -1;
    let syncOffset = 0.0;
    let speeds = [1.0, 1.25, 1.5, 0.8];
    let speedIdx = 0;
    let isLoop = false;
    let isEditing = false;

    // Render Lyrics and Chips
    function buildUI() {
      lyricsBox.innerHTML = '';
      sectionChips.innerHTML = '';
      lyricEls = [];

      lyricsData.forEach((item, index) => {
        if (item.sec) {
          const badge = document.createElement('div');
          badge.className = 'sec-badge';
          badge.textContent = item.sec;
          lyricsBox.appendChild(badge);

          const chip = document.createElement('button');
          chip.className = 'chip-btn';
          chip.textContent = item.sec;
          chip.onclick = () => {
            audio.currentTime = Math.max(0, item.time + syncOffset);
            if (audio.paused) audio.play();
          };
          sectionChips.appendChild(chip);
        }

        const line = document.createElement('div');
        line.className = 'lyric-item';
        
        if (isEditing) {
          const input = document.createElement('input');
          input.className = 'lyric-input';
          input.value = item.text;
          input.oninput = (e) => {
            lyricsData[index].text = e.target.value;
          };
          line.appendChild(input);
        } else {
          line.textContent = item.text;
          line.onclick = () => {
            audio.currentTime = Math.max(0, item.time + syncOffset);
            if (audio.paused) audio.play();
          };
        }

        lyricsBox.appendChild(line);
        lyricEls.push(line);
      });
    }

    // Toggle Edit Mode
    editLyricsBtn.onclick = () => {
      isEditing = !isEditing;
      editLyricsBtn.textContent = isEditing ? '💾 완료 및 저장' : '✏️ 가사 직접 수정';
      editLyricsBtn.style.background = isEditing ? 'var(--accent-purple)' : 'rgba(0, 242, 254, 0.15)';
      editLyricsBtn.style.color = '#fff';
      buildUI();
    };

    // Adjust Sync Offset dynamically
    function adjustOffset(val) {
      if (val === 0.0) {
        syncOffset = 0.0;
      } else {
        syncOffset += val;
      }
      syncOffset = Math.round(syncOffset * 10) / 10;
      offsetValEl.textContent = `${syncOffset > 0 ? '+' : ''}${syncOffset.toFixed(1)}s`;
    }

    // Playback Toggle
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => {
      playBtn.textContent = '❚❚';
      vinylDisc.classList.add('playing');
    });

    audio.addEventListener('pause', () => {
      playBtn.textContent = '▶';
      vinylDisc.classList.remove('playing');
    });

    // Speed Control
    speedBtn.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      const spd = speeds[speedIdx];
      audio.playbackRate = spd;
      speedBtn.textContent = `${spd}x`;
    });

    // Loop Toggle
    loopBtn.addEventListener('click', () => {
      isLoop = !isLoop;
      audio.loop = isLoop;
      loopBtn.textContent = isLoop ? '🔁 On' : '🔁 Off';
      loopBtn.style.borderColor = isLoop ? 'var(--accent-cyan)' : 'var(--card-border)';
    });

    // Time Format
    function fmt(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // Timeupdate Event with Sync Offset Application
    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      const dur = audio.duration || 155;

      currentTimeEl.textContent = fmt(cur);
      durationEl.textContent = fmt(dur);
      progressFill.style.width = `${(cur / dur) * 100}%`;

      const effectiveTime = cur - syncOffset;
      let activeIdx = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (effectiveTime >= lyricsData[i].time) {
          activeIdx = i;
        } else {
          break;
        }
      }

      if (activeIdx !== currentActiveIdx && activeIdx !== -1) {
        if (currentActiveIdx !== -1 && lyricEls[currentActiveIdx]) {
          lyricEls[currentActiveIdx].classList.remove('active');
        }
        currentActiveIdx = activeIdx;
        if (lyricEls[currentActiveIdx] && !isEditing) {
          lyricEls[currentActiveIdx].classList.add('active');
          lyricEls[currentActiveIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    });

    // Scrubber click
    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      audio.currentTime = ratio * (audio.duration || 155);
    });

    // Ambient Canvas Background Animation
    const bgCanvas = document.getElementById('bgCanvas');
    const ctx = bgCanvas.getContext('2d');
    let particles = [];

    function initBgCanvas() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 65; i++) {
        particles.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          radius: Math.random() * 2.5 + 1,
          color: ['#00f2fe', '#9d4edd', '#f72585', '#4361ee'][Math.floor(Math.random() * 4)],
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          alpha: Math.random() * 0.6 + 0.2
        });
      }
    }

    function drawBgCanvas() {
      ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fill();
      });
      requestAnimationFrame(drawBgCanvas);
    }

    window.addEventListener('resize', initBgCanvas);

    // Simulated Visualizer Bar Canvas
    const vizCanvas = document.getElementById('visualizerCanvas');
    const vCtx = vizCanvas.getContext('2d');

    function drawVisualizer() {
      vizCanvas.width = vizCanvas.offsetWidth;
      vizCanvas.height = vizCanvas.offsetHeight;
      vCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);

      const numBars = 32;
      const barWidth = (vizCanvas.width / numBars) - 3;
      const isPlaying = !audio.paused;

      for (let i = 0; i < numBars; i++) {
        const height = isPlaying ? (Math.random() * vizCanvas.height * 0.85 + 5) : 4;
        const x = i * (barWidth + 3);
        const y = vizCanvas.height - height;

        const grad = vCtx.createLinearGradient(0, vizCanvas.height, 0, 0);
        grad.addColorStop(0, '#00f2fe');
        grad.addColorStop(0.6, '#9d4edd');
        grad.addColorStop(1, '#f72585');

        vCtx.fillStyle = grad;
        vCtx.beginPath();
        vCtx.roundRect(x, y, barWidth, height, 4);
        vCtx.fill();
      }

      setTimeout(drawVisualizer, isPlaying ? 80 : 300);
    }

    // Init App
    buildUI();
    initBgCanvas();
    drawBgCanvas();
    drawVisualizer();
  </script>
</body>
</html>
